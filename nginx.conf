server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the nginx version
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/wasm application/json application/manifest+json image/svg+xml;

    # Hashed build assets never change: cache them for a year
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;

        # Module workers (pdf.js) must be served as JavaScript
        location ~ \.mjs$ {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            default_type application/javascript;
            try_files $uri =404;
        }
    }

    # Self-hosted PDF/OCR engine files (fonts, wasm, language data): not hashed, cache for a week
    location /vendor/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # Entry point and service worker must always be revalidated so updates roll out
    location ~ ^/(index\.html|sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # SPA fallback: unknown paths are client-side routes
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # Never serve dotfiles (e.g. .git, .env) should any end up in the web root
    location ~ /\. {
        deny all;
        return 404;
    }
}
