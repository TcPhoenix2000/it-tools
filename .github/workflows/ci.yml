name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: corepack enable

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linters
        run: pnpm lint

      - name: Run unit test
        run: pnpm vitest run --environment jsdom

      - name: Type check
        run: pnpm typecheck

      - name: Build the app
        run: pnpm build

      # Informational: list known advisories in shipped (non-dev) dependencies
      - name: Audit production dependencies
        run: pnpm audit --prod || true
