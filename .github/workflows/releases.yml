name: Release new versions

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  docker-release:
    needs: ci
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-build-scan-push.yml
    with:
      # The tag is v<version>; publish both :latest and :<version> (without the leading v)
      tags: |
        type=raw,value=latest
        type=match,pattern=v(.*),group=1
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  github-release:
    runs-on: ubuntu-latest
    needs: docker-release
    permissions:
      contents: write
    steps:
      - name: Get release version
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Compute image names
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          echo "GHCR_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/it-tools" >> "$GITHUB_ENV"
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            echo "DOCKERHUB_LINES=- Docker Hub: \`${DOCKERHUB_USERNAME,,}/it-tools:latest\`, \`${DOCKERHUB_USERNAME,,}/it-tools:${GITHUB_REF_NAME#v}\`" >> "$GITHUB_ENV"
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: corepack enable

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # No dependency cache: release artifacts are always built from a clean install
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the app
        run: pnpm build

      - name: Zip the app
        run: zip -r "it-tools-${RELEASE_VERSION}.zip" dist/*

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## Docker images"
            echo
            echo "- GitHub Container Registry: \`${GHCR_IMAGE}:latest\`, \`${GHCR_IMAGE}:${RELEASE_VERSION}\`"
            if [ -n "${DOCKERHUB_LINES:-}" ]; then echo "$DOCKERHUB_LINES"; fi
            echo
            echo "Images are scanned for vulnerabilities before publishing and ship with SBOM and provenance attestations."
            echo
            echo "## Changelog"
            echo
            node ./scripts/getLatestChangelog.mjs
          } > release-notes.md
          gh release create "$GITHUB_REF_NAME" "it-tools-${RELEASE_VERSION}.zip" --repo "$GITHUB_REPOSITORY" --draft --title "$GITHUB_REF_NAME" --notes-file release-notes.md
