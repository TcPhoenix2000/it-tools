name: Docker nightly release

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  check_date:
    runs-on: ubuntu-latest
    name: Check latest commit
    outputs:
      should_run: ${{ steps.should_run.outputs.should_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Scheduled runs are skipped when nothing was committed in the last 24 hours
      - id: should_run
        name: Check latest commit is less than a day old
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ -z "$(git rev-list --after='24 hours' HEAD)" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  ci:
    needs: check_date
    if: ${{ needs.check_date.outputs.should_run == 'true' }}
    uses: ./.github/workflows/ci.yml

  docker:
    needs: ci
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-build-scan-push.yml
    with:
      tags: |
        type=raw,value=nightly
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
